name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter analyze
      - run: flutter test
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; APK is signed with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: TaskBlocks-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: TaskBlocks-windows
          path: build/windows/x64/runner/Release/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release --build-number=${{ github.run_number }}
      # Zipped with ditto so the app bundle's permissions and symlinks survive the download.
      - run: ditto -c -k --keepParent "build/macos/Build/Products/Release/Task Blocks.app" TaskBlocks-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TaskBlocks-macos
          path: TaskBlocks-macos.zip

  # iPad (and iPhone). Built without signing: install it with your Apple ID using
  # Sideloadly or AltStore, or sign it in Xcode. See docs/IPAD.md.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      # Item 79: AltStore and Sideloadly read the entitlements already inside the app to know
      # which shared group (app group) to set up for the widgets. --no-codesign leaves none, so
      # the widget and the app are signed here with an ad-hoc signature that only carries them.
      # The sideloading tool replaces this signature with your Apple ID's.
      - name: Add entitlements (ad-hoc signature)
        run: |
          APP=build/ios/iphoneos/Runner.app
          for f in "$APP"/Frameworks/*; do codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements ios/TaskBlocksWidget/TaskBlocksWidget.entitlements "$APP"/PlugIns/TaskBlocksWidget.appex
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$APP"
          codesign -d --entitlements - "$APP"/PlugIns/TaskBlocksWidget.appex
          codesign -d --entitlements - "$APP"
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry TaskBlocks-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TaskBlocks-ios
          path: TaskBlocks-ios-unsigned.ipa
